services:
  capyflix-pwa:
    image: capyflix-pwa:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capyflix-pwa
    restart: unless-stopped
    ports:
      - "8008:80"
    environment:
      - BACKEND_HOST=capihouse-api
      - BACKEND_PORT=8000
      - PORT=80
    volumes:
      - /mnt/capyflix:/mnt/capyflix:ro
    networks:
      - capihouse_network

networks:
  capihouse_network:
    external: true
